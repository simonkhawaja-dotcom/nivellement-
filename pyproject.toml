[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "landlevel"
version = "0.1.0"
description = "Solveur de nivellement agricole (land leveling / grading) a partir d'un DEM"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "rasterio>=1.3",
    "scikit-learn>=1.3",
    "scikit-image>=0.22",
    "matplotlib>=3.8",
    "pyshp>=2.3",
    "shapely>=2.0",
]

[tool.setuptools.packages.find]
include = ["landlevel*"]
